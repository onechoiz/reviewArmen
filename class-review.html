<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#202A33;
    --ink-soft:#4B5560;
    --paper:#EFF2ED;
    --panel:#FFFFFF;
    --line:#D9DCD3;
    --accent:#C6862E;
    --accent-ink:#7A5219;
    --teal:#3E6E63;
    --known:#5C8A66;
    --known-bg:#E7EFE6;
    --review:#B4573F;
    --review-bg:#F6E7E2;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Spectral', serif;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  .wrap{
    max-width:840px;
    margin:0 auto;
    padding:0 20px 64px;
  }
  header.top{
    padding:40px 20px 0;
    max-width:840px;
    margin:0 auto;
  }
  header.top h1{
    font-size:2rem;
    letter-spacing:-0.01em;
  }
  header.top p{
    margin:10px 0 28px;
    color:var(--ink-soft);
    max-width:58ch;
    font-size:0.98rem;
  }
  nav.tabs{
    max-width:840px;
    margin:0 auto;
    display:flex;
    gap:4px;
    padding:0 20px;
    overflow-x:auto;
  }
  nav.tabs button{
    font-family:'Work Sans', sans-serif;
    font-size:0.92rem;
    font-weight:600;
    color:var(--ink-soft);
    background:#E3E6DD;
    border:1px solid var(--line);
    border-bottom:none;
    padding:11px 18px 13px;
    border-radius:9px 9px 0 0;
    cursor:pointer;
    transform:translateY(3px);
    transition:transform .15s ease, background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  nav.tabs button:hover{ color:var(--ink); }
  nav.tabs button.active{
    background:var(--panel);
    color:var(--ink);
    transform:translateY(0);
    border-color:var(--line);
  }
  main{
    max-width:840px;
    margin:0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:0 10px 10px 10px;
    padding:32px;
  }
  @media (max-width:600px){
    main{ padding:22px 16px; border-radius:0 0 10px 10px;}
    header.top{ padding:28px 16px 0; }
    nav.tabs{ padding:0 16px; }
  }
  .panel{ display:none; }
  .panel.active{ display:block; }

  /* ---- chips ---- */
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:26px;
  }
  .chip{
    font-family:'Work Sans', sans-serif;
    font-size:0.85rem;
    font-weight:500;
    padding:6px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip.active{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }

  /* ---- vocab ---- */
  .vocab-group{ margin-bottom:34px; }
  .vocab-group h2{
    font-size:1.18rem;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .term-row{
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .term-row:last-child{ border-bottom:none; }
  .term-main{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .term{
    font-family:'Spectral', serif;
    font-weight:600;
    font-size:1.04rem;
  }
  .ipa{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    color:var(--accent-ink);
    background:#F6ECDB;
    padding:1px 7px;
    border-radius:5px;
  }
  .def{ margin:4px 0 2px; color:var(--ink); }
  .ex{ margin:0; color:var(--ink-soft); font-style:italic; }

  /* ---- grammar ---- */
  .g-card{
    margin-bottom:30px;
    padding-bottom:28px;
    border-bottom:1px solid var(--line);
  }
  .g-card:last-child{ border:none; margin-bottom:0; padding-bottom:0; }
  .g-card h2{ font-size:1.22rem; margin-bottom:10px; }
  .g-card .rule{ margin:0 0 14px; }
  .formula{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.86rem;
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--teal);
    padding:10px 14px;
    border-radius:6px;
    margin:0 0 14px;
    overflow-x:auto;
    white-space:nowrap;
  }
  .g-card ul{ margin:0; padding-left:20px; }
  .g-card li{ margin-bottom:6px; }
  .g-card .note{
    margin-top:12px;
    font-size:0.92rem;
    color:var(--ink-soft);
    border-left:3px solid var(--accent);
    padding-left:12px;
  }

  /* ---- quiz ---- */
  #quiz-body{ min-height:260px; }
  .q-progress{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .q-prompt{
    font-family:'Spectral', serif;
    font-size:1.18rem;
    font-weight:600;
    margin-bottom:18px;
  }
  .q-options{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .q-opt{
    text-align:left;
    padding:12px 15px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    font-family:'Work Sans', sans-serif;
    font-size:0.96rem;
    cursor:pointer;
    color:var(--ink);
  }
  .q-opt:hover:not(:disabled){ border-color:var(--teal); }
  .q-opt.correct{ background:var(--known-bg); border-color:var(--known); }
  .q-opt.incorrect{ background:var(--review-bg); border-color:var(--review); }
  .q-opt:disabled{ cursor:default; }
  .q-next{
    margin-top:20px;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:8px;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.94rem;
    cursor:pointer;
  }
  .q-result{ text-align:left; }
  .q-result .score{
    font-family:'Spectral', serif;
    font-size:2.1rem;
    font-weight:700;
    margin:6px 0 4px;
  }
  .q-result p{ color:var(--ink-soft); margin:0 0 18px; }

  /* ---- flashcards ---- */
  .fc-controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:22px;
  }
  .fc-controls select{
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
    padding:8px 10px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
  }
  .fc-controls label{
    font-size:0.88rem;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .fc-stats{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .fc-card-wrap{
    perspective:1400px;
    margin:0 auto 22px;
    max-width:520px;
  }
  .fc-card{
    position:relative;
    min-height:220px;
    border-radius:14px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.4,.2,.2,1);
  }
  .fc-card.flipped{ transform:rotateY(180deg); }
  .fc-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:14px;
    border:1px solid var(--line);
    padding:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .fc-front{
    background:var(--panel);
  }
  .fc-front .term{ font-size:1.5rem; }
  .fc-back{
    background:#F5F3EA;
    transform:rotateY(180deg);
  }
  .fc-back .def{ font-size:1.02rem; margin-bottom:10px; }
  .fc-back .ex{ font-size:0.94rem; }
  .fc-cat-tag{
    position:absolute;
    top:12px;
    left:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
  }
  .fc-hint{
    position:absolute;
    bottom:12px;
    font-size:0.76rem;
    color:var(--ink-soft);
  }
  .fc-nav{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .fc-btn{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.9rem;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
  }
  .fc-btn.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .fc-btn.known{ background:var(--known-bg); border-color:var(--known); color:#2E4A34; }
  .fc-btn.review{ background:var(--review-bg); border-color:var(--review); color:#7A2E1E; }

  :focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
</style>
</head>
<body>

<header class="top">
  <h1>Class Recap</h1>
  <p id="subtitle"></p>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="vocab">Vocabulary</button>
  <button class="tab" data-tab="grammar">Grammar</button>
  <button class="tab" data-tab="practice">Practice</button>
  <button class="tab" data-tab="flashcards">Flashcards</button>
</nav>

<div class="wrap">
<main>

  <section id="vocab" class="panel active">
    <div class="chips" id="vocab-chips"></div>
    <div id="vocab-list"></div>
  </section>

  <section id="grammar" class="panel">
    <div id="grammar-list"></div>
  </section>

  <section id="practice" class="panel">
    <div id="quiz-body"></div>
  </section>

  <section id="flashcards" class="panel">
    <div class="fc-controls">
      <select id="fc-category"></select>
      <label><input type="checkbox" id="fc-review-only"> Only cards I'm still learning</label>
      <button class="fc-btn" id="fc-shuffle">Shuffle</button>
      <button class="fc-btn" id="fc-reset">Reset progress</button>
    </div>
    <div class="fc-stats" id="fc-stats"></div>
    <div class="fc-card-wrap">
      <div class="fc-card" id="fc-card" tabindex="0">
        <div class="fc-face fc-front">
          <span class="fc-cat-tag" id="fc-cat-front"></span>
          <div class="term" id="fc-term"></div>
          <span class="ipa" id="fc-ipa" style="margin-top:10px;"></span>
          <span class="fc-hint">tap to flip</span>
        </div>
        <div class="fc-face fc-back">
          <span class="fc-cat-tag" id="fc-cat-back"></span>
          <p class="def" id="fc-def"></p>
          <p class="ex" id="fc-ex"></p>
          <span class="fc-hint">tap to flip back</span>
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button class="fc-btn" id="fc-prev">Prev</button>
      <button class="fc-btn review" id="fc-learning">Still learning</button>
      <button class="fc-btn known" id="fc-known">Got it</button>
      <button class="fc-btn" id="fc-next">Next</button>
    </div>
  </section>

</main>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const vocabData = [
  { name: "Everyday Idioms & Small Talk", items: [
    {t:"out of the blue", d:"happening suddenly and without any warning", e:"He called me out of the blue after years of silence."},

  { name: "Precise & Diplomatic Language", items: [

/* =========================================================
   VOCAB
   ========================================================= */
const totalTerms = vocabData.reduce((n,c)=>n+c.items.length,0);
document.getElementById('subtitle').textContent =
  `${totalTerms} words and phrases from your recent classes, ${grammarData.length} grammar points, and a ${quizData.length}-question quiz to check what stuck.`;

function renderVocab(filter){
  const list = document.getElementById('vocab-list');
  list.innerHTML = '';
  vocabData.forEach(cat=>{
    if(filter!=='All' && filter!==cat.name) return;
    const group = document.createElement('div');
    group.className = 'vocab-group';
    const h = document.createElement('h2');
    h.textContent = cat.name;
    group.appendChild(h);
    cat.items.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'term-row';
      row.innerHTML = `
        <div class="term-main">
          <span class="term">${item.t}</span>
          ${item.ipa ? `<span class="ipa">${item.ipa}</span>` : ''}
        </div>
        <p class="def">${item.d}</p>
        <p class="ex">${item.e}</p>`;
      group.appendChild(row);

}
const chipsEl = document.getElementById('vocab-chips');
['All', ...vocabData.map(c=>c.name)].forEach(name=>{
  const chip = document.createElement('button');
  chip.className = 'chip' + (name==='All' ? ' active' : '');
  chip.textContent = name;

    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));

/* =========================================================
   QUIZ
   ========================================================= */
let quizOrder = [];
let quizIndex = 0;
let quizScore = 0;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  quizOrder = shuffle(quizData.map((q,i)=>i));
  quizIndex = 0;
  quizScore = 0;
  renderQuestion();
}

function renderQuestion(){
  const body = document.getElementById('quiz-body');
  const qi = quizOrder[quizIndex];
  const q = quizData[qi];
  const optOrder = shuffle(q.opts.map((o,i)=>i));

  body.innerHTML = `
    <div class="q-progress">Question ${quizIndex+1} of ${quizData.length}</div>
    <div class="q-prompt">${q.q}</div>
    <div class="q-options" id="q-options"></div>`;

  const optsEl = document.getElementById('q-options');
  optOrder.forEach(optIdx=>{
    const b = document.createElement('button');
    b.className = 'q-opt';
    b.textContent = q.opts[optIdx];
    b.addEventListener('click', ()=>answerQuestion(optIdx, q.correct));
    optsEl.appendChild(b);
  });
}

function answerQuestion(chosenIdx, correctIdx){
  const buttons = document.querySelectorAll('#q-options .q-opt');
  buttons.forEach(b=>{
    b.disabled = true;
    if(b.textContent === quizData[quizOrder[quizIndex]].opts[correctIdx]){
      b.classList.add('correct');
    } else if(b.textContent === quizData[quizOrder[quizIndex]].opts[chosenIdx] && chosenIdx!==correctIdx){
      b.classList.add('incorrect');
    }
  });
  if(chosenIdx===correctIdx) quizScore++;

  const body = document.getElementById('quiz-body');
  const next = document.createElement('button');
  next.className = 'q-next';
  next.textContent = quizIndex < quizData.length-1 ? 'Next question' : 'See results';
  next.addEventListener('click', ()=>{
    quizIndex++;
    if(quizIndex < quizData.length){ renderQuestion(); }
    else{ renderResults(); }
  });
  body.appendChild(next);
}

function renderResults(){
  const body = document.getElementById('quiz-body');
  body.innerHTML = `
    <div class="q-result">
      <p style="margin-bottom:0;">Your score</p>
      <div class="score">${quizScore} / ${quizData.length}</div>
      <p>${quizScore===quizData.length ? 'Everything landed.' : 'Worth a second look on the ones you missed.'}</p>
      <button class="q-next" id="q-restart">Try again</button>
    </div>`;
  document.getElementById('q-restart').addEventListener('click', startQuiz);
}
startQuiz();

/* =========================================================
   FLASHCARDS
   ========================================================= */
const flatCards = [];
vocabData.forEach(cat=>{
  cat.items.forEach(item=>{
    flatCards.push({ term:item.t, ipa:item.ipa||'', def:item.d, ex:item.e, cat:cat.name });
  });
});

const KNOWN_KEY = 'classRecapKnownTerms';
function getKnown(){
  try{ return new Set(JSON.parse(localStorage.getItem(KNOWN_KEY)) || []); }
  catch(e){ return new Set(); }
}
function saveKnown(set){
  try{ localStorage.setItem(KNOWN_KEY, JSON.stringify([...set])); }
  catch(e){}
}
let known = getKnown();

let fcDeck = flatCards.slice();
let fcIndex = 0;
let fcFlipped = false;

const catSelect = document.getElementById('fc-category');
['All categories', ...vocabData.map(c=>c.name)].forEach(name=>{
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  catSelect.appendChild(opt);
});

function buildDeck(){
  const cat = catSelect.value;
  const reviewOnly = document.getElementById('fc-review-only').checked;
  fcDeck = flatCards.filter(c=>{
    const catMatch = (cat==='All categories' || cat===c.cat);
    const reviewMatch = !reviewOnly || !known.has(c.term);
    return catMatch && reviewMatch;
  });
  fcIndex = 0;
  fcFlipped = false;
  renderCard();
}

function renderCard(){
  const wrapCard = document.getElementById('fc-card');
  wrapCard.classList.remove('flipped');
  fcFlipped = false;

  if(fcDeck.length===0){
    document.getElementById('fc-term').textContent = 'Nothing here';
    document.getElementById('fc-ipa').textContent = '';
    document.getElementById('fc-def').textContent = 'Try a different filter, everything in this set is already marked as known.';
    document.getElementById('fc-ex').textContent = '';
    document.getElementById('fc-cat-front').textContent = '';
    document.getElementById('fc-cat-back').textContent = '';
    document.getElementById('fc-stats').textContent = `0 of 0`;
    return;
  }

  const c = fcDeck[fcIndex];
  document.getElementById('fc-term').textContent = c.term;
  document.getElementById('fc-ipa').textContent = c.ipa;
  document.getElementById('fc-def').textContent = c.def;
  document.getElementById('fc-ex').textContent = c.ex;
  document.getElementById('fc-cat-front').textContent = c.cat;
  document.getElementById('fc-cat-back').textContent = c.cat;

  const knownCount = flatCards.filter(x=>known.has(x.term)).length;
  document.getElementById('fc-stats').textContent =
    `Card ${fcIndex+1} of ${fcDeck.length}   |   ${knownCount} of ${flatCards.length} marked as known`;
}

document.getElementById('fc-card').addEventListener('click', ()=>{
  if(fcDeck.length===0) return;
  fcFlipped = !fcFlipped;
  document.getElementById('fc-card').classList.toggle('flipped', fcFlipped);
});
document.getElementById('fc-card').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' || e.key===' '){
    e.preventDefault();
    document.getElementById('fc-card').click();
  }
});

document.getElementById('fc-prev').addEventListener('click', ()=>{
  if(fcDeck.length===0) return;
  fcIndex = (fcIndex - 1 + fcDeck.length) % fcDeck.length;
  renderCard();
});
document.getElementById('fc-next').addEventListener('click', ()=>{
  if(fcDeck.length===0) return;
  fcIndex = (fcIndex + 1) % fcDeck.length;
  renderCard();
});
document.getElementById('fc-known').addEventListener('click', ()=>{
  if(fcDeck.length===0) return;
  known.add(fcDeck[fcIndex].term);
  saveKnown(known);
  const reviewOnly = document.getElementById('fc-review-only').checked;
  if(reviewOnly){ buildDeck(); } else {
    fcIndex = (fcIndex + 1) % fcDeck.length;
    renderCard();
  }
});
document.getElementById('fc-learning').addEventListener('click', ()=>{
  if(fcDeck.length===0) return;
  known.delete(fcDeck[fcIndex].term);
  saveKnown(known);
  fcIndex = (fcIndex + 1) % fcDeck.length;
  renderCard();
});
document.getElementById('fc-shuffle').addEventListener('click', ()=>{
  fcDeck = shuffle(fcDeck);
  fcIndex = 0;
  renderCard();
});
document.getElementById('fc-reset').addEventListener('click', ()=>{
  known = new Set();
  saveKnown(known);
  buildDeck();
});
catSelect.addEventListener('change', buildDeck);
document.getElementById('fc-review-only').addEventListener('change', buildDeck);

buildDeck();
</script>
